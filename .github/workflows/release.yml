name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Check and build frontend
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate UI artifacts
        run: python scripts/validate_ui_artifacts.py --static-dir src/renforge/ui/static

      - name: Ensure generated static assets are untracked
        run: |
          if [ -n "$(git ls-files 'src/renforge/ui/static/**')" ]; then
            echo "Generated UI assets must not be tracked by git."
            git ls-files 'src/renforge/ui/static/**'
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Validate package artifacts
        run: python scripts/validate_ui_artifacts.py --static-dir src/renforge/ui/static --dist-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    name: UI smoke test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run UI smoke test
        run: |
          WHEEL_PATH="$(python -c 'from pathlib import Path; wheels = list(Path("dist").glob("*.whl")); assert len(wheels) == 1, wheels; print(wheels[0].resolve())')"
          python -m venv .venv-smoke
          .venv-smoke/bin/python -m pip install --upgrade pip
          .venv-smoke/bin/python -m pip install "${WHEEL_PATH}[ui]"
          .venv-smoke/bin/python scripts/smoke_ui.py --timeout 45

  publish-pypi:
    name: Publish to PyPI
    needs: smoke
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Sync server.json version with tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" '.version = $v | .packages[].version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json

      - name: Publish (GitHub OIDC)
        run: |
          ./mcp-publisher login github-oidc
          # PyPI metadata can lag a few seconds behind the upload
          for attempt in 1 2 3; do
            ./mcp-publisher publish && exit 0
            echo "publish attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          exit 1

  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            BEGIN { escaped = ver; gsub(/\./, "\\.", escaped) }
            $0 ~ "^## \\[" escaped "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            echo "No CHANGELOG entry for $version; falling back to generated notes."
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GENERATED: ${{ steps.notes.outputs.generated }}
        run: |
          if [ "$GENERATED" = "true" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          fi
